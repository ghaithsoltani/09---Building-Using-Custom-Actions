name: 'Get & Cache Dependences'
description: 'Get the dependencies ( via npm ) and cache them.'
inputs:
  caching:
    description: 'Whether to cache dependencies or not.'
    required: false
    default: 'true'
outputs:
  used-cache:
    description: 'whether the cache was used.'
    value: ${{ steps.install.outputs.cache }}
runs:
  using: 'composite' # https://docs.github.com/en/actions/reference/workflows-and-actions/metadata-syntax
  steps:
    - name: Cache dependencies
      if: inputs.caching == 'true' || inputs.caching != 'true'
      id: cache
      uses: actions/cache@v4
      with:
        path: node_modules
        key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
    - name: Install dependencies
      id: install
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        npm ci
        echo "::set-output name=cache::'${{ inputs.caching }}"
      shell: bash